name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # The repository checks need no install. They run on their own before anything is installed, and verify runs
      # them again, so a change to scripts/verify.ts that only CI would notice still fails here.
      - name: Check repository
        run: node scripts/check-repository.ts
      # The version must equal packageManager in package.json; verify compares them.
      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts pnpm@11.25.0
      # No install script runs: the root and workspace packages may define none, and allowBuilds in
      # pnpm-workspace.yaml allows none for dependencies.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Verify repository
        run: node scripts/verify.ts

  ci:
    name: ci
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
