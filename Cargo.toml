[workspace]
resolver = "3"
members = [
    "packages/api-contracts/rust",
    "packages/quant-core",
    "apps/engine",
]
# Vendored skill evaluations hold their own Cargo manifests. They are not part of the product.
exclude = [".agents"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
openquant-contracts = { path = "packages/api-contracts/rust" }
openquant-core = { path = "packages/quant-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
thiserror = "2"
sha2 = "0.11"
regress = "0.12"
jsonschema = { version = "0.61.2", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"
